<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <article
      data-qa="card"
      class="product-card"
    >
      <img
        class="product-card__icon"
        src="images/imac.jpeg"
        alt="Product icon"
      />
      <div class="product-card__container">
        <h3 class="product-card__name">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h3>

        <p class="product-card__code">Product code: 195434</p>
        <div class="product-card__reviews-blok">
          <div class="stars stars--4">
            <div class="stars__star"></div>

            <div class="stars__star"></div>

            <div class="stars__star"></div>

            <div class="stars__star"></div>

            <div class="stars__star"></div>
          </div>
          <div class="product-card__reviews-text">Reviews: 5</div>
        </div>

        <div class="product-card__price-blok">
          <p class="product-card__price-text">Price:</p>
          <p class="product-card__price-number">$2,199</p>
        </div>
        <button
          class="product-card__button-buy"
          data-qa="hover"
        >
          BUY
        </button>
      </div>
    </article>
  </body>
</html>
